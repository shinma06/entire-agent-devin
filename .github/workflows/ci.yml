name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: go build -o bin/entire-agent-devin ./cmd/entire-agent-devin
      - name: Protocol compliance
        run: |
          go install github.com/entireio/external-agents-tests@latest
          cd "$RUNNER_TEMP" && "$(go env GOPATH)/bin/external-agents-tests" verify "$GITHUB_WORKSPACE/bin/entire-agent-devin"
